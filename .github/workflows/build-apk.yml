name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Sett opp JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHubs Ubuntu-maskiner har Android SDK forhåndsinstallert (ANDROID_HOME).
      - name: Vis Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Sett opp Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bygg debug-APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Last opp APK som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Legger APK-en ut under «Releases» så den kan lastes ned direkte på telefonen.
      - name: Publiser APK under Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk samtaletranskribering.apk
          gh release create "bygg-${{ github.run_number }}" samtaletranskribering.apk \
            --title "Samtaletranskribering – bygg ${{ github.run_number }}" \
            --notes "Automatisk bygget fra ${{ github.sha }}. Last ned samtaletranskribering.apk og installer på telefonen." \
            --latest
